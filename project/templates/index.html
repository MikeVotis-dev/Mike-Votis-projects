{% extends "layout.html" %}

{% block main %}
<h2>Dashboard</h2>
<table class="table table-striped table-hover mt-3">
    <thead>
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Category</th>
            <th>Amount</th>
        </tr>
    </thead>
    <tbody>
        {% for row in transactions %}
        <tr>
            <td>{{ row.date }}</td>
            <td>{{ row.type }}</td>
            <td>{{ row.category }}</td>
            <td>${{ row.amount }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
